# Sokal Bela is a website, not an npm package, so there is nothing to publish.
# This workflow just runs the checks (syntax + product images) on pushes and pull requests.
# (File name kept so existing links to it keep working.)
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
