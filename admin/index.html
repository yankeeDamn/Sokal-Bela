<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#123c1f">
<title>Sokal Bela · Admin</title>
<link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <div class="logo">🥬</div><h1>Sokal Bela Admin</h1><p>Sign in with your administrator account.</p>
    <label>Mobile number<input name="phone" inputmode="numeric" maxlength="10" autocomplete="tel-national" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <input name="website" tabindex="-1" autocomplete="off" class="trap" aria-hidden="true">
    <button class="btn primary" type="submit">Sign in</button>
    <p id="login-error" class="err" role="alert"></p>
    <a class="back" href="/">← Back to store</a>
  </form>
</div>
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="brand"><span>🥬</span><div>Sokal Bela<small>Admin console</small></div></div>
    <nav id="nav" aria-label="Admin sections"></nav>
    <div class="side-foot"><a href="/">View store ↗</a><button class="linkbtn" id="logout">Sign out</button></div>
  </aside>
  <div class="main">
    <header class="bar"><button class="menu" id="menu" aria-label="Menu">☰</button><h1 id="title">Overview</h1><div class="bar-right"><span id="who"></span><button class="btn small" id="refresh">↻ Refresh</button></div></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin/admin.js" defer></script>
</body></html>
